<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Booking Dashboard - The Royal Hideaway</title>
    <style>
      :root {
        --bg: #f6f5f1;
        --surface: #ffffff;
        --text: #1f2421;
        --muted: #6b716d;
        --line: #dedcd3;
        --accent: #1f5f4a;
        --ok: #1f7a4d;
        --warn: #a15c00;
        --bad: #a8322b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151816;
          --surface: #1e2320;
          --text: #e9ece9;
          --muted: #9aa39d;
          --line: #323933;
          --accent: #6fc7a5;
          --ok: #6fc7a5;
          --warn: #e0a856;
          --bad: #ee8079;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 16px 24px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }
      h1 { margin: 0; font-size: 18px; flex: 1 1 auto; }
      h2 { margin: 0 0 12px; font-size: 15px; }
      main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
      .badge {
        padding: 2px 10px;
        border: 1px solid currentColor;
        border-radius: 999px;
        font-size: 13px;
        white-space: nowrap;
      }
      .badge.live { color: var(--ok); }
      .badge.waiting { color: var(--warn); }
      .badge.off { color: var(--muted); }
      button, select, input {
        font: inherit;
        color: inherit;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 12px;
      }
      button { cursor: pointer; }
      button:disabled { cursor: default; opacity: 0.5; }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 20px;
      }
      #login { max-width: 360px; margin: 48px auto; }
      #login label { display: block; margin-bottom: 12px; }
      #login input { display: block; width: 100%; margin-top: 4px; }
      .error { color: var(--bad); min-height: 1.5em; margin: 0 0 8px; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
      .card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
      .card .label { color: var(--muted); font-size: 13px; }
      .card .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
      .toolbar .spacer { flex: 1 1 auto; }
      .scroll { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
      th { color: var(--muted); font-size: 13px; font-weight: 500; }
      td.num, th.num { text-align: right; }
      .status-confirmed { color: var(--ok); }
      .status-cancelled { color: var(--muted); }
      .muted { color: var(--muted); }
      #events { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow-y: auto; }
      #events li { padding: 6px 0; border-bottom: 1px solid var(--line); }
    </style>
  </head>
  <body>
    <header>
      <h1>Booking Dashboard · The Royal Hideaway</h1>
      <span id="connection" class="badge off" role="status">ยังไม่เชื่อมต่อ</span>
      <button id="logout" type="button" hidden>ออกจากระบบ</button>
    </header>

    <main>
      <section id="login" class="panel">
        <h2>เข้าสู่ระบบผู้ดูแล</h2>
        <form id="login-form">
          <label>อีเมล <input id="email" type="email" autocomplete="username" required /></label>
          <label>รหัสผ่าน <input id="password" type="password" autocomplete="current-password" required /></label>
          <p id="login-error" class="error" role="alert"></p>
          <button class="primary" type="submit">เข้าสู่ระบบ</button>
        </form>
      </section>

      <div id="dashboard" hidden>
        <section class="panel" aria-labelledby="summary-title">
          <h2 id="summary-title">สรุป <span id="summary-date" class="muted"></span></h2>
          <div id="summary" class="cards"></div>
        </section>

        <section class="panel" aria-labelledby="bookings-title">
          <div class="toolbar">
            <h2 id="bookings-title">การจองทั้งหมด <span id="bookings-total" class="muted"></span></h2>
            <span class="spacer"></span>
            <label>สถานะ
              <select id="status-filter">
                <option value="">ทั้งหมด</option>
                <option value="confirmed">ยืนยันแล้ว</option>
                <option value="cancelled">ยกเลิกแล้ว</option>
              </select>
            </label>
          </div>
          <div class="scroll">
            <table>
              <thead>
                <tr>
                  <th>เลขที่</th>
                  <th>ห้อง</th>
                  <th>ผู้จอง</th>
                  <th>Check-in</th>
                  <th>Check-out</th>
                  <th>สถานะ</th>
                  <th class="num">ราคาต่อคืน</th>
                  <th class="num">ราคารวม</th>
                  <th>กฎราคา</th>
                  <th>จองเมื่อ</th>
                </tr>
              </thead>
              <tbody id="bookings"></tbody>
            </table>
          </div>
          <div class="toolbar">
            <span id="page-info" class="muted"></span>
            <span class="spacer"></span>
            <button id="prev" type="button">ก่อนหน้า</button>
            <button id="next" type="button">ถัดไป</button>
          </div>
        </section>

        <section class="panel" aria-labelledby="events-title">
          <h2 id="events-title">เหตุการณ์ล่าสุด</h2>
          <ul id="events" aria-live="polite"></ul>
        </section>
      </div>
    </main>

    <script src="/admin/dashboard.js"></script>
  </body>
</html>
